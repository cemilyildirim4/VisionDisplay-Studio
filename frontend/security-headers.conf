# Container icinde: /etc/nginx/conf.d/security-headers.inc
# Not: Nginx, bir location kendi add_header'ini tanimladiginda ust duzey
# basliklari DUSURUR. Bu yuzden her location bu dosyayi include etmeli.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:5007 http://127.0.0.1:5007 ws: wss:; media-src 'self' blob:; worker-src 'self' blob:;" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
