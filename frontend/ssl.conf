# Production Nginx — container icinde /etc/nginx/conf.d/default.conf
# nginx-unprivileged: HTTP 8080, HTTPS 8443 (host'ta 80/443'e map edilir).
# Sertifikalar: /etc/nginx/certs/fullchain.pem + privkey.pem
# (Let's Encrypt: SSL_CERT_DIR=/etc/letsencrypt/live/ORNEK.COM)

# HTTP → HTTPS
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml
        application/manifest+json font/woff2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/conf.d/security-headers.inc;

    location /healthz {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|mp4)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
