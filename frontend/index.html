<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Site ikonu ŞEFFAF PNG. Önce favicon.svg kullanılıyordu; içinde koyu
      (#0b0f16) yuvarlatılmış bir arka plan dikdörtgeni vardı, bu yüzden logo
      sekmede ve kısayollarda siyah bir kutunun içinde görünüyordu. Yeni
      dosyalar logonun kendisi — arkası saydam, bulunduğu yüzeyin rengini alır.
    -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="theme-color" content="#2962ad" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Sayfa zaten Türkçe: tarayıcının otomatik çevirisini kapat (Türkçe'yi tekrar
         Türkçe'ye çevirip metinleri bozmasını önler) -->
    <meta name="google" content="notranslate" />
    <meta name="description" content="Masaüstü Bilişim Teknolojileri — LED ekran ve video duvarı konfigüratörü" />
    <title>Masaüstü Bilişim · Ekran Konfigüratörü</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      BEYAZ EKRAN KURTARMASI.

      Uygulama bir servis çalışanıyla (PWA) önbelleğe alınıyor. Yeni bir
      sürüm yayınlandığında tarayıcıda ESKİ index.html kalabiliyor; o dosya
      artık var olmayan betik adreslerini çağırdığı için hiçbir şey
      çizilmiyor ve sayfa bembeyaz kalıyor. Kullanıcının bunu anlaması ya da
      önbelleği elle temizlemesi beklenemez.

      Kök öğe birkaç saniye sonra hâlâ boşsa servis çalışanları kaldırılıyor,
      önbellekler siliniyor ve sayfa BİR KEZ yenileniyor. Bayrak sekmeye özel
      (sessionStorage), dolayısıyla döngüye girme ihtimali yok; uygulama
      açıldıysa bu kod hiçbir şey yapmıyor.
    -->
    <script>
      ;(function () {
        var BAYRAK = 'vds-beyaz-kurtarma'
        setTimeout(function () {
          var kok = document.getElementById('root')
          if (!kok || kok.childElementCount > 0) return
          try {
            if (sessionStorage.getItem(BAYRAK)) return
            sessionStorage.setItem(BAYRAK, '1')
          } catch (e) {
            /* gizli sekmede sessionStorage kapalı olabilir */
          }
          var isler = []
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              isler.push(
                navigator.serviceWorker.getRegistrations().then(function (liste) {
                  return Promise.all(
                    liste.map(function (r) {
                      return r.unregister()
                    }),
                  )
                }),
              )
            }
            if (window.caches && caches.keys) {
              isler.push(
                caches.keys().then(function (adlar) {
                  return Promise.all(
                    adlar.map(function (ad) {
                      return caches.delete(ad)
                    }),
                  )
                }),
              )
            }
          } catch (e) {
            /* ignore */
          }
          Promise.all(isler)
            .catch(function () {})
            .then(function () {
              location.reload()
            })
        }, 6000)
      })()
    </script>
  </body>
</html>
