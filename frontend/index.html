<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Site ikonu ŞEFFAF PNG. Önce favicon.svg kullanılıyordu; içinde koyu
      (#0b0f16) yuvarlatılmış bir arka plan dikdörtgeni vardı, bu yüzden logo
      sekmede ve kısayollarda siyah bir kutunun içinde görünüyordu. Yeni
      dosyalar logonun kendisi — arkası saydam, bulunduğu yüzeyin rengini alır.
    -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="theme-color" content="#2962ad" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Sayfa zaten Türkçe: tarayıcının otomatik çevirisini kapat (Türkçe'yi tekrar
         Türkçe'ye çevirip metinleri bozmasını önler) -->
    <meta name="google" content="notranslate" />
    <meta name="description" content="Masaüstü Bilişim Teknolojileri — LED ekran ve video duvarı konfigüratörü" />
    <title>Masaüstü Bilişim · Ekran Konfigüratörü</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      BEYAZ EKRAN KURTARMASI.

      Boş sayfanın iki ayrı sebebi var, çareleri birbirinin zıddı:

      1) Eski önbellek: uygulama PWA olarak önbelleğe alınıyor, yeni sürüm
         çıkınca tarayıcıda ESKİ index.html kalabiliyor; artık var olmayan
         betik adreslerini çağırdığı için hiçbir şey çizilmiyor. Çaresi
         önbelleği silip bir kez yenilemek.

      2) Adrese ulaşılamıyor: sunucu erişime kapalıysa (ağ/operatör engeli)
         betikler indirilemediği için sayfa yine bembeyaz kalıyor. Burada
         önbelleği silmek ZARARLI olur — elde kalan tek kopya da gider.

      Bu yüzden önce aynı adresten küçük bir dosya çekiliyor: iniyorsa (1),
      inmiyorsa (2) kabul edilip kullanıcıya ne olduğu yazılıyor. Yenileme
      sekmeye özel bir bayrakla bir kezle sınırlı, döngüye girmiyor.
    -->
    <script>
      ;(function () {
        var BAYRAK = 'vds-beyaz-kurtarma'

        function mesaj(baslik, metin) {
          var k = document.createElement('div')
          k.setAttribute(
            'style',
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
              'background:#0b0f16;color:#e7edf6;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif;padding:24px;text-align:center',
          )
          k.innerHTML =
            '<div style="max-width:420px"><div style="font-size:20px;font-weight:600;margin-bottom:10px">' +
            baslik +
            '</div><div style="opacity:.8">' +
            metin +
            '</div></div>'
          document.body.appendChild(k)
        }

        function onbellegiTemizle() {
          var isler = []
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              isler.push(
                navigator.serviceWorker.getRegistrations().then(function (liste) {
                  return Promise.all(
                    liste.map(function (r) {
                      return r.unregister()
                    }),
                  )
                }),
              )
            }
            if (window.caches && caches.keys) {
              isler.push(
                caches.keys().then(function (adlar) {
                  return Promise.all(
                    adlar.map(function (ad) {
                      return caches.delete(ad)
                    }),
                  )
                }),
              )
            }
          } catch (e) {
            /* ignore */
          }
          return Promise.all(isler).catch(function () {})
        }

        setTimeout(function () {
          var kok = document.getElementById('root')
          if (!kok || kok.childElementCount > 0) return

          /* Sunucuya gerçekten ulaşılıyor mu? Önbellek devreye girmesin diye
             hem no-store hem de her seferinde farklı bir adres. */
          fetch('/logo-192.png?kontrol=' + Date.now(), { cache: 'no-store' })
            .then(function (c) {
              if (!c || !c.ok) throw new Error('yanit yok')
              /* Sunucu ayakta: suçlu eski önbellek. Bir kez temizleyip yenile. */
              try {
                if (sessionStorage.getItem(BAYRAK)) {
                  mesaj('Uygulama açılamadı', 'Tarayıcıyı tamamen kapatıp yeniden açmayı deneyin.')
                  return
                }
                sessionStorage.setItem(BAYRAK, '1')
              } catch (e) {
                /* gizli sekmede sessionStorage kapalı olabilir */
              }
              return onbellegiTemizle().then(function () {
                location.reload()
              })
            })
            .catch(function () {
              /* Sunucuya ulaşılamıyor: önbelleğe DOKUNMA, durumu yaz. */
              mesaj(
                'Siteye ulaşılamıyor',
                'Bağlantınız bu adrese erişemiyor. Başka bir ağ (örneğin telefonun mobil verisi) deneyin; sorun sürerse adresin engellenmiş olup olmadığını kontrol ettirin.',
              )
            })
        }, 6000)
      })()
    </script>
  </body>
</html>
