server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — metin tabanlı varlıkları sıkıştırarak ilk yükleme süresini kısaltır.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml
        application/manifest+json font/woff2;

    # SPA fallback: React Router benzeri istemci-taraflı yönlendirme olmasa da,
    # doğrudan derin bağlantı ile açılan sayfaların 404 vermesini önler.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker ve manifest her zaman güncel doğrulanmalı — uzun süre cache'lenmemeli.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # İçeriği hash'lenmiş statik varlıklar (JS/CSS/font) — 1 yıl agresif cache,
    # Vite her build'te dosya adını değiştirdiği için güvenli.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Görseller / video — orta süreli cache.
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Statik dosya sunumunda da temel güvenlik başlıkları (backend'deki ile tutarlı).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Sunucu imzasını gizle (bilgi sızıntısını azaltır).
    server_tokens off;
}
