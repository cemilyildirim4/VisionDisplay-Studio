# Container icinde: /etc/nginx/conf.d/default.conf
# Yetkisiz nginx (nginx-unprivileged) 80'e baglanamaz; 8080 dinler.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml
        application/manifest+json font/woff2;

    include /etc/nginx/conf.d/security-headers.inc;

    # API reverse proxy — tarayici /api'ye ayni origin'den giderse gercek istemci
    # IP'si X-Forwarded-For ile Kestrel'e ulasir (rate limiting dogru calisir).
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA fallback: derin baglantilarin 404 vermesini onler.
    # index.html uzun sure cache'lenmesin: yeni build'de hash'li JS adi degisir.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|mp4)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
