# Canli ortam. Kullanim:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Gerekli .env: DB_PASSWORD, JWT_SECRET (>=32), CORS_ORIGINS, SSL_CERT_DIR, DOMAIN
# Let's Encrypt ornegi: SSL_CERT_DIR=/etc/letsencrypt/live/ornek.com
# Sertifika dosyalari uid 101 (nginx) tarafindan okunabilir olmali.

services:
  postgres:
    image: postgres:16-alpine
    container_name: display_config_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanimli olmali}
      POSTGRES_DB: display_configurator_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d display_configurator_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./src
      dockerfile: DisplayConfigurator.Api/Dockerfile
    container_name: display_config_api
    restart: always
    user: "1654:1654"
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=display_configurator_db;Username=postgres;Password=${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS tanimli olmali (https://ornek.com)}
      Staff__TesterCode: ${STAFF_TESTER_CODE:-}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET tanimli olmali}
      JWT_SECRET: ${JWT_SECRET}
      Beta__Enabled: ${BETA_ENABLED:-false}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Notifications__AdminEmail: ${NOTIFICATIONS_ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        # Ayni origin /api proxy — tarayici API'ye dogrudan gitmez.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: display_config_frontend
    restart: always
    user: "101:101"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./frontend/ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/security-headers-prod.conf:/etc/nginx/conf.d/security-headers.inc:ro
      - ${SSL_CERT_DIR:?SSL_CERT_DIR tanimli olmali}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
